apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: ai-gateway-mesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      serviceAccountName: ai-gateway
      containers:
        - name: gateway
          image: ai-gateway-mesh:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: /etc/ai-gateway/gateway.yaml
            - name: SMALL_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: small-model-api-key
            - name: LARGE_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: large-model-api-key
            - name: CODER_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: coder-model-api-key
          volumeMounts:
            - name: config
              mountPath: /etc/ai-gateway
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
      volumes:
        - name: config
          configMap:
            name: ai-gateway-config
