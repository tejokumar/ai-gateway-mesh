apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: ai-gateway
  namespace: ai-gateway-mesh
spec:
  host: ai-gateway.ai-gateway-mesh.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
